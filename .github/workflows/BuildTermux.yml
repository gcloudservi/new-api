name: Build Artifacts (Termux)

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - '*'
      - '!*-alpha*'

jobs:
  termux:
    name: Termux (Android arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Determine Version (commit hash)
        run: |
          VERSION=$(git rev-parse --short HEAD)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Build Backend (Termux arm64)
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "1"
        run: |
          SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          export CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++"
          export CGO_LDFLAGS="-L$SYSROOT/usr/lib/aarch64-linux-android/21 -llog"
          echo "Using CC=$CC"
          echo "Using CGO_LDFLAGS=$CGO_LDFLAGS"
          go mod download
          go build \
            -ldflags "-s -w -X 'new-api/common.Version=$VERSION'" \
            -o new-api-$VERSION-termux-arm64

      - name: Generate checksums
        run: sha256sum new-api-*-termux-arm64 > checksums-termux.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: termux-build
          path: |
            new-api-*-termux-arm64
            checksums-termux.txt
